global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "iotdb-datanode"
    scrape_interval: 2s
    metrics_path: /metrics
    static_configs:
      - targets: ["iotdb-service:9091"]
        labels:
          component: "datanode"

  - job_name: "iotdb-confignode"
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["iotdb-service:9092"]
        labels:
          component: "confignode"

  - job_name: "cadvisor"
    scrape_interval: 2s
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
