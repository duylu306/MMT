# Pinned configuration for Apache IoTDB 1.3.3-standalone write-cost experiment.

####################
### Cluster & Node RPC Configuration (Single-Node 1C1D Standalone)
####################
cluster_name=defaultCluster

cn_seed_config_node=iotdb-service:10710
dn_seed_config_node=iotdb-service:10710

cn_internal_address=iotdb-service
cn_internal_port=10710
cn_consensus_port=10720

dn_rpc_address=0.0.0.0
dn_rpc_port=6667
dn_internal_address=iotdb-service
dn_internal_port=10730
dn_mpp_data_exchange_port=10740
dn_schema_region_consensus_port=10750
dn_data_region_consensus_port=10760

####################
### Replication & Partition Configuration
####################
schema_replication_factor=1
data_replication_factor=1
default_schema_region_group_num_per_database=1
data_region_group_extension_policy=AUTO
default_data_region_group_num_per_database=2
data_region_per_data_node=4.0
timestamp_precision=ms

####################
### Directory Configuration
####################
cn_system_dir=data/confignode/system
cn_consensus_dir=data/confignode/consensus
dn_system_dir=data/datanode/system
dn_data_dirs=data/datanode/data
dn_consensus_dir=data/datanode/consensus
dn_wal_dirs=data/datanode/wal

####################
### Memory & MemTable Flush Configuration
####################
# DataNode ON_HEAP_MEMORY=1536M, OFF_HEAP_MEMORY=512M (via datanode-env.sh MEMORY_SIZE=2048M)
datanode_memory_proportion=3:3:1:1:1:1
storage_engine_memory_proportion=8:2
write_memory_proportion=19:1
flush_proportion=0.4
reject_proportion=0.8

enable_separate_data=true
tvlist_sort_algorithm=TIM
# Trigger MemTable flush every 2,500 points/series on average so multi-file seq/unseq
# separation and background compactions occur realistically within each benchmark run.
avg_series_point_number_threshold=2500
enable_timed_flush_seq_memtable=true
seq_memtable_flush_interval_in_ms=600000
enable_timed_flush_unseq_memtable=true
unseq_memtable_flush_interval_in_ms=600000
flush_thread_count=4

####################
### Compaction & TsFile Configuration
####################
enable_seq_space_compaction=true
enable_unseq_space_compaction=true
enable_cross_space_compaction=true
compaction_priority=BALANCE
cross_selector=rewrite
cross_performer=fast
inner_seq_selector=size_tiered_multi_target
inner_seq_performer=read_chunk
inner_unseq_selector=size_tiered_multi_target
inner_unseq_performer=fast
inner_compaction_candidate_file_num=10
min_cross_compaction_unseq_file_level=0
compaction_schedule_interval_in_ms=2000
compaction_thread_count=4
sub_compaction_thread_count=2
compaction_write_throughput_mb_per_sec=0
target_chunk_size=1048576
page_size_in_byte=65536
compressor=LZ4

####################
### Write-Ahead Log (WAL) Configuration
####################
wal_mode=ASYNC
wal_buffer_size_in_byte=33554432
wal_file_size_threshold_in_byte=31457280
wal_async_mode_fsync_delay_in_ms=1000
enable_wal_compression=false

####################
### Prometheus Metric Configuration
####################
cn_metric_reporter_list=PROMETHEUS
cn_metric_level=IMPORTANT
cn_metric_async_collect_period=2
cn_metric_prometheus_reporter_port=9092

dn_metric_reporter_list=PROMETHEUS
dn_metric_level=NORMAL
dn_metric_async_collect_period=2
dn_metric_prometheus_reporter_port=9091
dn_metric_internal_reporter_type=MEMORY
